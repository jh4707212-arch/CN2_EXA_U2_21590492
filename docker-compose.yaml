version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: password
      POSTGRES_DB: estudiantes_db
    deploy:
      placement:
        constraints:
          - node.role == worker # <--- El contenedor de PostgreSQL va al worker

  web:
    image: quesito/crud_estudiantes:latest
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://usuario:password@db:5432/estudiantes_db
    deploy:
      placement:
        constraints:
          - node.role == manager # <--- La app web va al manager  